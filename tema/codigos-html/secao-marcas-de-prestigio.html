  </div>

  <div class="uk-marcas__grade">
    <a class="uk-marca" href="/marca/tramontina.html" title="Tramontina"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/tramontina.svg" alt="Tramontina" loading="lazy"></a>
    <a class="uk-marca" href="/marca/tecno.html" title="Tecno"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/tecno.svg" alt="Tecno" loading="lazy"></a>
    <a class="uk-marca" href="/marca/jacuzzi.html" title="Jacuzzi"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/jacuzzi.svg" alt="Jacuzzi" loading="lazy"></a>
    <a class="uk-marca" href="/marca/gorenje.html" title="Gorenje"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/gorenje.svg" alt="Gorenje" loading="lazy"></a>
    <a class="uk-marca" href="/marca/franke.html" title="Franke"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/franke.svg" alt="Franke" loading="lazy"></a>

    <a class="uk-marca" href="/marca/elettromec.html" title="Elettromec"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/elettromec.svg" alt="Elettromec" loading="lazy"></a>
    <span class="uk-marca" title="Duravit"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/duravit-logo.svg" alt="Duravit" loading="lazy"></span>
    <span class="uk-marca" title="Doka"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/doka.svg" alt="Doka" loading="lazy"></span>
    <span class="uk-marca" title="Docol"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/docol.svg" alt="Docol" loading="lazy"></span>

</section>

<style>
.uk-marcas {
  background: #f7f7f5;
  padding: 80px 30px 72px;
  margin: 80px 0 0 0;
  border: 0;
  box-sizing: border-box;
}
.uk-marcas__cabecalho {
  text-align: center;
  margin-bottom: 36px;
}
html body .uk-marcas__titulo {
  font-family: 'Urbane', sans-serif !important;
  font-weight: 700 !important;
  font-size: 16px !important;
  letter-spacing: 2.5px !important;
  text-transform: uppercase !important;
  color: #1a1a1a !important;
  margin: 0 0 14px 0 !important;
}
.uk-marcas__titulo::after {
  content: "";
  display: block;
  width: 32px;
  height: 1px;
  margin: 12px auto 0;
  background: #c49a45;
}
.uk-marcas__subtitulo {
  font-family: 'Urbane', sans-serif;
  font-weight: 300;
  font-size: 13px;
  color: #777777;
  margin: 0;
}
.uk-marcas__grade {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-top: 1px solid #e6e3dc;
  border-left: 1px solid #e6e3dc;
}
.uk-marca {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 110px;
  padding: 0 20px;
  border-right: 1px solid #e6e3dc;
  border-bottom: 1px solid #e6e3dc;
  box-sizing: border-box;
  background: transparent;
  transition: background-color 0.3s ease;
}
.uk-marca img {
  display: block;
  width: auto;
  height: 80px;
  max-width: 85%;
  max-height: none;
  object-fit: contain;
  filter: grayscale(100%);
  opacity: 0.7;
  /* Alguns arquivos de logo vêm com fundo branco: "multiply" faz o branco sumir no fundo da faixa */
  mix-blend-mode: multiply;
  transition: filter 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
}
a.uk-marca:hover {
  background: #ffffff;
}
.uk-marca:hover img {
  filter: grayscale(0%);
  opacity: 1;
  transform: scale(1.05);
}
@media (max-width: 979px) {
  .uk-marcas {
    padding: 44px 15px;
  }
  .uk-marcas__grade {
    grid-template-columns: repeat(4, 1fr);
  }
  .uk-marca {
    height: 90px;
  }
}
@media (max-width: 520px) {
  .uk-marcas__grade {
    grid-template-columns: repeat(2, 1fr);
  }
  .uk-marca {
    height: 80px;
  }
  .uk-marca img {
    height: 60px;
  }
}
</style>

<script>
$(document).ready(function(){
  var $secao = $('.uk-marcas');
  if ($secao.length === 0) return;
  if ($('.custom-footer-restored').length > 0) {
    $('.custom-footer-restored').before($secao);
  } else if ($('#rodape').length > 0) {
    $('#rodape').before($secao);
  } else {
    $('.conteiner-principal').append($secao);
  }
});
</script>
