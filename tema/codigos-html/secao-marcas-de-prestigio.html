<!-- SEÇÃO DE MARCAS DE PRESTÍGIO - UNIKITCHEN -->
<div class="unikitchen-marcas-secao">
  <div class="conteiner">
    <div class="titulo-secao-marcas">
      <h2>MARCAS DE PRESTÍGIO</h2>
      <p>Trabalhamos com os maiores fabricantes de eletrodomésticos e metais do mundo</p>
    </div>
    
    <div class="marcas-grid">
      <div class="marca-item"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/logo-elettromec.png" alt="Elettromec" loading="lazy"></div>
      <div class="marca-item"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/logo-doka.png" alt="Doka" loading="lazy"></div>
      <div class="marca-item"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/logo-crissair.png" alt="Crissair" loading="lazy"></div>
      <div class="marca-item"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/logo-lofra.png" alt="Lofra" loading="lazy"></div>
      <div class="marca-item"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/logo-delonghi.png" alt="DeLonghi" loading="lazy"></div>
      <div class="marca-item"><img src="https://cdn.awsli.com.br/1080/1080230/arquivos/logo-tecno.png" alt="Tecno" loading="lazy"></div>
    </div>
  </div>
</div>

<style>
.unikitchen-marcas-secao {
  background: #ffffff;
  padding: 45px 0;
  border-top: 1px solid #eeeeee;
  border-bottom: 1px solid #eeeeee;
  margin: 40px 0;
  text-align: center;
}
.titulo-secao-marcas h2 {
  font-family: 'Urbane', sans-serif !important;
  font-weight: 700 !important;
  font-size: 16px !important;
  color: #1a1a1a !important;
  letter-spacing: 2.5px !important;
  text-transform: uppercase !important;
  margin-bottom: 6px !important;
}
.titulo-secao-marcas p {
  font-family: 'Urbane', sans-serif;
  font-size: 13px;
  color: #777777;
  font-weight: 300;
  margin-bottom: 30px;
}
.marcas-grid {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 40px;
}
.marca-item {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  padding: 5px 15px;
  transition: all 0.3s ease;
}
.marca-item img {
  max-height: 42px;
  max-width: 140px;
  object-fit: contain;
  filter: grayscale(100%);
  opacity: 0.5;
  transition: all 0.3s ease;
}
.marca-item:hover img {
  filter: grayscale(0%);
  opacity: 1;
  transform: scale(1.06);
}
@media (max-width: 767px) {
  .marcas-grid {
    gap: 20px;
  }
  .marca-item img {
    max-height: 32px;
    max-width: 110px;
  }
}
</style>

<script>
$(document).ready(function(){
  if ($('.unikitchen-marcas-secao').length > 0) {
    if ($('.custom-footer-restored').length > 0) {
      $('.custom-footer-restored').before($('.unikitchen-marcas-secao'));
    } else if ($('#rodape').length > 0) {
      $('#rodape').before($('.unikitchen-marcas-secao'));
    } else {
      $('.conteiner-principal').append($('.unikitchen-marcas-secao'));
    }
  }
});
</script>
