<!-- BOTÃO "VER ESPECIFICAÇÕES" - VITRINE MINIMALISTA LUXO -->
<script>
$(document).ready(function(){
  function aplicarVerEspecificacoes() {
    $('.listagem-item .botao-comprar').each(function(){
      var $btn = $(this);
      $btn.html('<i class="icon-search" style="font-size: 11px; margin-right: 6px;"></i> VER ESPECIFICAÇÕES');
      $btn.attr('title', 'Ver especificações técnicas do produto');
      $btn.addClass('btn-ver-especificacoes');
    });
  }

  aplicarVerEspecificacoes();
  $(document).ajaxComplete(function() {
    aplicarVerEspecificacoes();
  });
});
</script>

<style>
/* ESTILIZAÇÃO CLEAN LUXO DO BOTÃO DA VITRINE */
html body .listagem-item .botao-comprar,
html body .listagem-item .btn-ver-especificacoes {
  background: #ffffff !important;
  color: #1a1a1a !important;
  border: 1px solid #1a1a1a !important;
  font-family: 'Urbane', sans-serif !important;
  font-size: 11px !important;
  font-weight: 600 !important;
  letter-spacing: 1px !important;
  text-transform: uppercase !important;
  padding: 8px 14px !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  transition: all 0.25s ease-in-out !important;
  display: inline-block !important;
  margin-top: 10px !important;
  text-decoration: none !important;
}

/* Efeito Hover Elegante (Transição para Preto / Dourado) */
html body .listagem-item:hover .botao-comprar,
html body .listagem-item:hover .btn-ver-especificacoes {
  background: #1a1a1a !important;
  color: #ffffff !important;
  border-color: #1a1a1a !important;
}

html body .listagem-item .botao-comprar:hover,
html body .listagem-item .btn-ver-especificacoes:hover {
  background: #c49a45 !important;
  color: #ffffff !important;
  border-color: #c49a45 !important;
}
</style>
