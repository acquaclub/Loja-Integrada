<!-- BARRA DE QUALIDADES (ABAIXO DO BANNER) -->
<div class="uk-beneficios">
  <div class="uk-beneficios__grid">

    <div class="uk-beneficio">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c49a45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M17 11l2 2 4-4"/></svg>
      <div class="uk-beneficio__texto">
        <strong>Consultoria especializada</strong>
        <span>Atendimento dedicado ao seu projeto.</span>
      </div>
    </div>

    <a class="uk-beneficio" href="/pagina/logistica.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c49a45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="6" width="14" height="11" rx="1"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="18.5" r="2"/></svg>
      <div class="uk-beneficio__texto">
        <strong>Entrega fracionada</strong>
        <span>Conforme o andamento da sua obra.</span>
      </div>
    </a>

    <a class="uk-beneficio" href="https://www.google.com/maps/search/?api=1&amp;query=Av.%20Ant%C3%B4nio%20Carlos%20Comitre%2C%201253%20-%20Parque%20Campolim%2C%20Sorocaba%20-%20SP" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c49a45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21.5s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <div class="uk-beneficio__texto">
        <strong>Showroom em Sorocaba</strong>
        <span>Veja e conheça os produtos de perto.</span>
      </div>
    </a>

    <div class="uk-beneficio">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c49a45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></svg>
      <div class="uk-beneficio__texto">
        <strong>Garantia oficial</strong>
        <span>Produtos originais com garantia do fabricante.</span>
      </div>
    </div>

  </div>
</div>

<style>
.uk-beneficios {
  background: #ffffff;
  border-bottom: 0;
  padding: 48px 30px;
  margin: 0;
  box-sizing: border-box;
}
.uk-beneficios__grid {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
}
.uk-beneficio {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 0;
  border: 0;
  text-decoration: none !important;
  color: inherit !important;
}
.uk-beneficio svg {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  transition: stroke 0.2s ease;
}
a.uk-beneficio:hover svg {
  stroke: #1a1a1a;
}
.uk-beneficio__texto {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.uk-beneficio__texto strong {
  font-family: 'Urbane', sans-serif;
  font-weight: 700;
  font-size: 13px;
  line-height: 1.2;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #1a1a1a;
}
.uk-beneficio__texto span {
  font-family: 'Urbane', sans-serif;
  font-weight: 300;
  font-size: 13px;
  line-height: 1.4;
  color: #555555;
}
a.uk-beneficio:hover .uk-beneficio__texto strong {
  color: #c49a45;
}
/* Computador: faixa entre linhas finas, com divisórias entre os itens e respiro igual ao das vitrines */
@media (min-width: 980px) {
  .uk-beneficios {
    padding: 64px 30px 0;
  }
  .uk-beneficios__grid {
    gap: 0;
    padding: 34px 0;
    border-top: 1px solid #e6e3dc;
    border-bottom: 1px solid #e6e3dc;
  }
  .uk-beneficio {
    gap: 14px;
    padding: 0 16px;
  }
  .uk-beneficio + .uk-beneficio {
    border-left: 1px solid #ece9e3;
  }
}
/* Telas largas: título de cada item numa linha só */
@media (min-width: 1240px) {
  .uk-beneficio__texto strong {
    white-space: nowrap;
  }
}
@media (max-width: 979px) {
  .uk-beneficios {
    padding: 28px 15px;
    margin-bottom: 25px;
  }
  .uk-beneficios__grid {
    grid-template-columns: repeat(2, 1fr);
    row-gap: 24px;
  }
  .uk-beneficio {
    justify-content: flex-start;
    gap: 12px;
  }
  .uk-beneficio svg {
    width: 30px;
    height: 30px;
  }
  .uk-beneficio__texto strong {
    font-size: 12px;
    letter-spacing: 0.8px;
  }
  .uk-beneficio__texto span {
    font-size: 12px;
  }
}
/* Celular: só o título, alinhado ao meio do ícone */
@media (max-width: 767px) {
  html body .uk-beneficios .uk-beneficio {
    align-items: center !important;
  }
  html body .uk-beneficios .uk-beneficio__texto span {
    display: none !important;
  }
}
</style>

<script>
// Coloca a barra logo abaixo do banner na hora (sem esperar a página carregar),
// para ela já aparecer no lugar e não empurrar os Destaques (Cumulative Layout Shift)
(function () {
  var barra = document.querySelector('.uk-beneficios');
  if (!barra) return;
  var alvo = document.querySelector('.secao-banners') || document.getElementById('banner-home') || document.getElementById('cabecalho');
  if (alvo) alvo.parentNode.insertBefore(barra, alvo.nextSibling);
})();
</script>
