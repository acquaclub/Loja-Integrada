<script>
$(document).ready(function(){
  var $atalhos = $('#quickCategoriesMobile');

  if ($('#cabecalho').length > 0) {

  } else if ($('.conteiner-principal').length > 0) {
    $('.conteiner-principal').prepend($atalhos);

});
</script>
